kind = "web"
previewPath = "/"
title = "Vision9 Solar"
version = "1.0.0"
id = "artifacts/vision9-solar"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25036

[services.development]
run = "pnpm --filter @workspace/vision9-solar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vision9-solar", "run", "build" ]
publicDir = "artifacts/vision9-solar/dist/public"
serve = "static"

# Pre-rendered pages (scripts/prerender.mjs) first, then the plain app shell.
[[services.production.rewrites]]
from = "/"
to = "/index.html"

[[services.production.rewrites]]
from = "/modular-racking"
to = "/modular-racking.html"

[[services.production.rewrites]]
from = "/modular-racking/"
to = "/modular-racking.html"

[[services.production.rewrites]]
from = "/services"
to = "/services.html"

[[services.production.rewrites]]
from = "/services/"
to = "/services.html"

[[services.production.rewrites]]
from = "/net-metering"
to = "/net-metering.html"

[[services.production.rewrites]]
from = "/net-metering/"
to = "/net-metering.html"

[[services.production.rewrites]]
from = "/about"
to = "/about.html"

[[services.production.rewrites]]
from = "/about/"
to = "/about.html"

[[services.production.rewrites]]
from = "/galleries"
to = "/galleries.html"

[[services.production.rewrites]]
from = "/galleries/"
to = "/galleries.html"

[[services.production.rewrites]]
from = "/estimates"
to = "/estimates.html"

[[services.production.rewrites]]
from = "/estimates/"
to = "/estimates.html"

[[services.production.rewrites]]
from = "/contact"
to = "/contact.html"

[[services.production.rewrites]]
from = "/contact/"
to = "/contact.html"

[[services.production.rewrites]]
from = "/*"
to = "/spa.html"

[services.env]
PORT = "25036"
BASE_PATH = "/"
