<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vision9 Modular Racking">
  <!-- sun: seasonal angle adjustment cue -->
  <circle cx="14" cy="14" r="4.5" fill="#8FCF20" />
  <g stroke="#8FCF20" stroke-width="2" stroke-linecap="round">
    <line x1="14" y1="4" x2="14" y2="7.5" />
    <line x1="4" y1="14" x2="7.5" y2="14" />
    <line x1="6.6" y1="6.6" x2="9.1" y2="9.1" />
    <line x1="21.4" y1="6.6" x2="18.9" y2="9.1" />
  </g>

  <!-- ground line -->
  <line x1="9" y1="53" x2="55" y2="53" stroke="#3F4F73" stroke-width="2.5" stroke-linecap="round" />

  <!-- A-frame stand -->
  <g stroke="#3F4F73" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="24" y1="42" x2="21" y2="53" />
    <line x1="46" y1="31" x2="48" y2="53" />
    <line x1="46" y1="31" x2="27" y2="53" />
  </g>

  <!-- tilted solar panel -->
  <g transform="rotate(-22 33 35)">
    <rect x="14" y="25" width="40" height="20" rx="2.5" fill="#3F4F73" stroke="#8FCF20" stroke-width="2.5" />
    <line x1="14" y1="35" x2="54" y2="35" stroke="#8FCF20" stroke-width="1.5" opacity="0.55" />
    <line x1="27.3" y1="25" x2="27.3" y2="45" stroke="#8FCF20" stroke-width="1.5" opacity="0.55" />
    <line x1="40.6" y1="25" x2="40.6" y2="45" stroke="#8FCF20" stroke-width="1.5" opacity="0.55" />
  </g>
</svg>
