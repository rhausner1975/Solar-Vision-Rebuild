openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Vision9 Solar API — public forms, admin auth, gallery CMS, object uploads.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: public
  - name: admin
  - name: galleries
  - name: storage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /contact-submissions:
    post:
      operationId: createContactSubmission
      tags: [public]
      summary: Submit a contact-us message
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactSubmissionInput" }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionAck" }

  /estimate-requests:
    post:
      operationId: createEstimateRequest
      tags: [public]
      summary: Submit an estimate request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstimateRequestInput" }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionAck" }

  /public/galleries:
    get:
      operationId: listPublicGalleries
      tags: [public]
      summary: List published galleries with images
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GalleryWithImages" }
  /public/galleries/{slug}:
    get:
      operationId: getPublicGallery
      tags: [public]
      summary: Get a single published gallery by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GalleryWithImages" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Sign in to the admin area
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401":
          description: Invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Sign out
      responses:
        "204": { description: Signed out }
  /admin/me:
    get:
      operationId: adminMe
      tags: [admin]
      summary: Current signed-in admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /admin/password:
    post:
      operationId: adminChangePassword
      tags: [admin]
      summary: Change current admin password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordInput" }
      responses:
        "204": { description: Updated }
        "400":
          description: Invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /admin/password-reset/request:
    post:
      operationId: requestAdminPasswordReset
      tags: [admin]
      summary: Request a one-time password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestPasswordResetInput" }
      responses:
        "204": { description: Accepted }
        "429":
          description: Too many requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /admin/password-reset/confirm:
    post:
      operationId: confirmAdminPasswordReset
      tags: [admin]
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmPasswordResetInput" }
      responses:
        "204": { description: Password updated }
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /admin/contact-submissions:
    get:
      operationId: listContactSubmissions
      tags: [admin]
      summary: List contact submissions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContactSubmission" }
  /admin/contact-submissions/{id}:
    delete:
      operationId: deleteContactSubmission
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
  /admin/contact-submissions/{id}/resend-notification:
    post:
      operationId: resendContactSubmissionNotification
      tags: [admin]
      summary: Re-send the email/SMS alert for a contact submission
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendNotificationInput" }
      responses:
        "200":
          description: Updated submission with new delivery status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactSubmission" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /admin/estimate-requests:
    get:
      operationId: listEstimateRequests
      tags: [admin]
      summary: List estimate requests
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EstimateRequest" }
  /admin/estimate-requests/{id}:
    delete:
      operationId: deleteEstimateRequest
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
  /admin/estimate-requests/{id}/resend-notification:
    post:
      operationId: resendEstimateRequestNotification
      tags: [admin]
      summary: Re-send the email/SMS alert for an estimate request
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendNotificationInput" }
      responses:
        "200":
          description: Updated estimate request with new delivery status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EstimateRequest" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /admin/galleries:
    get:
      operationId: listGalleries
      tags: [galleries]
      summary: List galleries (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GalleryWithImages" }
    post:
      operationId: createGallery
      tags: [galleries]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GalleryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Gallery" }
  /admin/galleries/{id}:
    patch:
      operationId: updateGallery
      tags: [galleries]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GalleryInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Gallery" }
    delete:
      operationId: deleteGallery
      tags: [galleries]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /admin/galleries/{id}/images:
    post:
      operationId: addGalleryImage
      tags: [galleries]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GalleryImageInput" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GalleryImage" }
  /admin/gallery-images/{id}:
    patch:
      operationId: updateGalleryImage
      tags: [galleries]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GalleryImageUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GalleryImage" }
    delete:
      operationId: deleteGalleryImage
      tags: [galleries]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /admin/notification-settings:
    get:
      operationId: getNotificationSettings
      tags: [admin]
      summary: Get notification recipient list
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
    put:
      operationId: updateNotificationSettings
      tags: [admin]
      summary: Update notification recipient list
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400":
          description: Invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /admin/notification-settings/test:
    post:
      operationId: sendTestNotification
      tags: [admin]
      summary: Send a test notification email to the saved recipients
      responses:
        "200":
          description: Result of the test send (200 indicates the request was processed; check `delivered`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestNotificationResult" }

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Get a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestUploadUrlBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestUploadUrlResponse" }

components:
  schemas:
    HealthStatus:
      type: object
      properties: { status: { type: string } }
      required: [status]
    ApiError:
      type: object
      properties: { error: { type: string } }
      required: [error]
    SubmissionAck:
      type: object
      properties:
        id: { type: integer }
        ok: { type: boolean }
      required: [id, ok]

    ContactSubmissionInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 320 }
        phone: { type: ["string", "null"], maxLength: 50 }
        subject: { type: ["string", "null"], maxLength: 300 }
        message: { type: string, minLength: 1, maxLength: 5000 }
      required: [name, email, message]
    NotificationStatus:
      type: string
      enum: [pending, sent, failed, skipped]
    ResendNotificationInput:
      type: object
      properties:
        channels:
          type: array
          items:
            type: string
            enum: [email, sms]
    ContactSubmission:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        subject: { type: ["string", "null"] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        emailStatus: { $ref: "#/components/schemas/NotificationStatus" }
        emailError: { type: ["string", "null"] }
        emailSentAt: { type: ["string", "null"], format: date-time }
        smsStatus: { $ref: "#/components/schemas/NotificationStatus" }
        smsError: { type: ["string", "null"] }
        smsSentAt: { type: ["string", "null"], format: date-time }
      required:
        [id, name, email, message, createdAt, emailStatus, smsStatus]

    EstimateRequestInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 320 }
        phone: { type: ["string", "null"], maxLength: 50 }
        address: { type: ["string", "null"], maxLength: 500 }
        propertyType: { type: ["string", "null"], maxLength: 100 }
        projectType: { type: ["string", "null"], maxLength: 200 }
        monthlyBill: { type: ["string", "null"], maxLength: 100 }
        timeline: { type: ["string", "null"], maxLength: 100 }
        notes: { type: ["string", "null"], maxLength: 5000 }
      required: [name, email]
    EstimateRequest:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        propertyType: { type: ["string", "null"] }
        projectType: { type: ["string", "null"] }
        monthlyBill: { type: ["string", "null"] }
        timeline: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        emailStatus: { $ref: "#/components/schemas/NotificationStatus" }
        emailError: { type: ["string", "null"] }
        emailSentAt: { type: ["string", "null"], format: date-time }
        smsStatus: { $ref: "#/components/schemas/NotificationStatus" }
        smsError: { type: ["string", "null"] }
        smsSentAt: { type: ["string", "null"], format: date-time }
      required: [id, name, email, createdAt, emailStatus, smsStatus]

    LoginInput:
      type: object
      properties:
        username: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 1, maxLength: 200 }
      required: [username, password]
    RequestPasswordResetInput:
      type: object
      properties:
        username: { type: string, minLength: 1, maxLength: 100 }
      required: [username]
    ConfirmPasswordResetInput:
      type: object
      properties:
        token: { type: string, minLength: 32, maxLength: 200 }
        newPassword: { type: string, minLength: 12, maxLength: 200 }
      required: [token, newPassword]
    ChangePasswordInput:
      type: object
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 200 }
        newPassword: { type: string, minLength: 12, maxLength: 200 }
      required: [currentPassword, newPassword]
    AdminUser:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        mustChangePassword: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, username, mustChangePassword, createdAt]

    GalleryInput:
      type: object
      properties:
        slug: { type: string, minLength: 1, maxLength: 200 }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: ["string", "null"], maxLength: 2000 }
        location: { type: ["string", "null"], maxLength: 200 }
        systemSizeKw: { type: ["number", "null"], minimum: 0, maximum: 100000 }
        panelBrand: { type: ["string", "null"], maxLength: 200 }
        inverterBrand: { type: ["string", "null"], maxLength: 200 }
        installDate: { type: ["string", "null"], format: date }
        durationDays: { type: ["integer", "null"], minimum: 0, maximum: 100000 }
        story: { type: ["string", "null"], maxLength: 20000 }
        published: { type: boolean }
      required: [slug, title, published]
    Gallery:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        description: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        systemSizeKw: { type: ["number", "null"] }
        panelBrand: { type: ["string", "null"] }
        inverterBrand: { type: ["string", "null"] }
        installDate: { type: ["string", "null"], format: date }
        durationDays: { type: ["integer", "null"] }
        story: { type: ["string", "null"] }
        published: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, slug, title, published, createdAt]
    GalleryImage:
      type: object
      properties:
        id: { type: integer }
        galleryId: { type: integer }
        objectPath: { type: string }
        caption: { type: ["string", "null"] }
        altText: { type: ["string", "null"] }
        sortOrder: { type: integer }
      required: [id, galleryId, objectPath, sortOrder]
    GalleryImageInput:
      type: object
      properties:
        objectPath: { type: string, minLength: 1, maxLength: 500 }
        caption: { type: ["string", "null"], maxLength: 500 }
        altText: { type: ["string", "null"], maxLength: 300 }
        sortOrder: { type: ["integer", "null"] }
      required: [objectPath]
    GalleryImageUpdate:
      type: object
      properties:
        caption: { type: ["string", "null"], maxLength: 500 }
        altText: { type: ["string", "null"], maxLength: 300 }
        sortOrder: { type: ["integer", "null"] }
    GalleryWithImages:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        description: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        systemSizeKw: { type: ["number", "null"] }
        panelBrand: { type: ["string", "null"] }
        inverterBrand: { type: ["string", "null"] }
        installDate: { type: ["string", "null"], format: date }
        durationDays: { type: ["integer", "null"] }
        story: { type: ["string", "null"] }
        published: { type: boolean }
        createdAt: { type: string, format: date-time }
        images:
          type: array
          items: { $ref: "#/components/schemas/GalleryImage" }
      required: [id, slug, title, published, createdAt, images]

    NotificationSettings:
      type: object
      properties:
        recipients:
          type: array
          items: { type: string, format: email }
        updatedAt: { type: string, format: date-time }
      required: [recipients, updatedAt]
    TestNotificationResult:
      type: object
      properties:
        delivered: { type: boolean }
        recipients:
          type: array
          items: { type: string, format: email }
        error: { type: ["string", "null"] }
      required: [delivered, recipients]
    NotificationSettingsInput:
      type: object
      properties:
        recipients:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, format: email, maxLength: 320 }
      required: [recipients]

    RequestUploadUrlBody:
      type: object
      properties:
        name: { type: string }
        size: { type: integer }
        contentType: { type: string }
      required: [name, size, contentType]
    RequestUploadUrlResponse:
      type: object
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
      required: [uploadURL, objectPath]
